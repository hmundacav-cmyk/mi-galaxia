<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#02030a">
  <meta name="description" content="Un pequeño universo creado con cariño para Ashly Mishell.">
  <title>Un universo para Ashly Mishell</title>
  <link rel="stylesheet" href="estilos.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="universo" id="universo">
    <canvas class="cielo" id="cielo" aria-hidden="true"></canvas>
    <div class="velo" aria-hidden="true"></div>

    <header class="encabezado">
      <span class="sobrelinea">UN PEQUEÑO UNIVERSO</span>
      <span class="destello" aria-hidden="true">✧</span>
    </header>

    <section class="escena" aria-label="Escena espacial interactiva">
      <button class="luna" id="luna" type="button" aria-label="Toca" aria-describedby="ayuda"></button>
      <div class="mensaje" id="mensaje" aria-live="polite" aria-atomic="true">
        <span class="mensaje-adorno" aria-hidden="true">✦</span>
        <p id="frase"></p>
        <span class="linea-dorada" aria-hidden="true"><i></i>✧<i></i></span>
      </div>
    </section>

    <footer class="pie">
      <button class="invitacion" id="avanzar" type="button">
        <span class="icono-toque" aria-hidden="true">✧</span>
        <span id="ayuda">TOCA LA GALAXIA O HAZ CLIC EN EL ESPACIO</span>
      </button>
      <div class="progreso" id="progreso" aria-label="Mensaje 1 de 3">
        <span class="punto activo"></span><span class="punto"></span><span class="punto"></span>
      </div>
      <span class="firma">HECHO DE ESTRELLAS Y CARIÑO</span>
    </footer>
  </main>
</body>
</html>
